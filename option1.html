<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Email Signature</title>
<!--[if gte mso 9]>
<xml>
  <o:OfficeDocumentSettings>
    <o:AllowPNG/>
    <o:PixelsPerInch>96</o:PixelsPerInch>
  </o:OfficeDocumentSettings>
</xml>
<![endif]-->
<style type="text/css">
  body { margin: 0; padding: 0; }
  a { text-decoration: none; border: none; }
  img { display: block; border: 0; }
  
  @media only screen and (max-width: 480px) {
    .sig-container { width: 100% !important; max-width: 600px !important; }
    .sig-top-cell { padding: 20px 0px 10px 15px !important; }
    .sig-left-block { width: 55% !important; }
    .sig-logo-block { width: 35% !important; padding-right: 15px !important; padding-top: 0px !important; }
    .sig-logo-img { width: 130px !important; height: auto !important; }
    .sig-banner-img { width: 100% !important; height: auto !important; }
  }
</style>
</head>
<body style="margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
  <table class="sig-container" cellpadding="0" cellspacing="0" border="0" width="600" style="width: 600px; font-family: Arial, Helvetica, sans-serif; background-color: #ffffff; border-collapse: collapse; table-layout: fixed;">
    <!-- Top Row with Content and Logo -->
    <tr>
      <td bgcolor="#ffffff" class="sig-top-cell" style="background-color: #ffffff; padding: 25px 0px 10px 5px;" valign="top">
        <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: collapse;">
          <tr>
            <!-- Left Block -->
            <td class="sig-left-block" width="355" style="width: 355px; font-family: Arial, Helvetica, sans-serif;" valign="top">
              <div style="font-size: 18px; font-weight: bold; color: #111111; line-height: 22px; margin: 0; padding: 0 0 4px 0;">YourFirstname YourLastname</div>
              <div style="font-size: 14px; color: #b61a1d; line-height: 18px; margin: 0; padding: 0 0 8px 0;">Your designation</div>
              <div style="font-size: 13px; color: #333333; line-height: 16px; margin: 0; padding: 0 0 0 0;">
                <a href="mailto:firstname.lastname@longhouse.in" style="color: #333333; text-decoration: none;">firstname.lastname@longhouse.in</a>
                <span style="color: #333333; margin: 0 4px;">|</span>
                <a href="tel:+919876543210" style="color: #333333; text-decoration: none; white-space: nowrap;"><span style="color: #333333;">+91 9876543210</span></a>
              </div>
              
              <!-- Social Icons Table with top & bottom padding strictly enforced via cell heights for Outlook -->
              <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                <tr>
                  <!-- Native row-height wrapper to force strict rendering gap across all email clients -->
                  <td height="14" style="height: 14px; font-size: 1px; line-height: 1px;">&nbsp;</td>
                </tr>
                <tr>
                  <td valign="top">
                    <table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse;">
                      <tr>
                        <td style="padding-right: 8px;" valign="middle">
                          <a href="https://www.linkedin.com/company/491822/" target="_blank" style="text-decoration: none; border: 0;">
                            <img src="https://longhouse.in/wp-content/uploads/2026/06/LinkedIn.png" width="22" height="22" alt="LinkedIn" style="display: block; border: 0; width: 22px; height: 22px;" />
                          </a>
                        </td>
                        <td style="padding-right: 8px;" valign="middle">
                          <a href="https://twitter.com/Longhouse_C" target="_blank" style="text-decoration: none; border: 0;">
                            <img src="https://longhouse.in/wp-content/uploads/2026/06/twitter.png" width="22" height="22" alt="Twitter/X" style="display: block; border: 0; width: 22px; height: 22px;" />
                          </a>
                        </td>
                        <td style="padding-right: 0px;" valign="middle">
                          <a href="https://longhouse.in/" target="_blank" style="text-decoration: none; border: 0;">
                            <img src="https://longhouse.in/wp-content/uploads/2026/06/Web.png" width="22" height="22" alt="Website" style="display: block; border: 0; width: 22px; height: 22px;" />
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <!-- Bottom space cushion underneath icons prior to banner element -->
                  <td height="12" style="height: 12px; font-size: 1px; line-height: 1px;">&nbsp;</td>
                </tr>
              </table>
            </td>
            
            <!-- Divider Column (VML Fixed for Outlook Desktop to enforce rendering) -->
            <td width="25" style="width: 25px;padding-bottom: 0px;" valign="middle" align="center">
              <table cellpadding="0" cellspacing="0" border="0" width="1" height="95" style="border-collapse: collapse; height: 95px; width: 1px;">
                <tr>
                  <td width="1" height="95" bgcolor="#d98d8f" style="width: 1px; height: 95px; background-color: #d98d8f; font-size: 1px; line-height: 1px; padding: 0;">
                    <!--[if gte mso 9]>
                    <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:1px; height:95px;">
                      <v:fill color="#d98d8f" />
                    </v:rect>
                    <![endif]-->
                  </td>
                </tr>
              </table>
            </td>
            
            <!-- Right Block (Vertically centered for both Gmail and Outlook via absolute middle-alignment mechanics) -->
            <td class="sig-logo-block" width="210" style="width: 210px; padding-right: 20px;" valign="middle" align="center">
              <!--[if gte mso 9]>
              <table cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td height="10" style="font-size:1px; line-height:1px;">&nbsp;</td>
                </tr>
                <tr>
                  <td align="center" valign="middle">
              <![endif]-->
              <a href="https://longhouse.in/" target="_blank" style="text-decoration: none; border: 0; display: inline-block;">
                <img class="sig-logo-img" src="https://longhouse.in/wp-content/uploads/2024/12/Longhouse-Header-Logo.png" width="160" alt="Longhouse by Careernet" style="display: block; border: 0; width: 160px; height: auto; margin: 0 auto;" />
              </a>
              <!--[if gte mso 9]>
                  </td>
                </tr>
              </table>
              <![endif]-->
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <!-- Footer Banner Section -->
    <tr>
      <td bgcolor="#ffffff" style="background-color: #ffffff; padding: 0; margin: 0;" valign="top">
        <a href="https://longhouse.in/" target="_blank" style="text-decoration: none; border: 0; display: block;">
          <img class="sig-banner-img" src="https://longhouse.in/wp-content/uploads/2026/06/lh-sign-banner.png" width="600" alt="Leadership. Future-ready." style="display: block; border: 0; width: 600px; height: auto;" />
        </a>
      </td>
    </tr>
  </table>
</body>
</html>
